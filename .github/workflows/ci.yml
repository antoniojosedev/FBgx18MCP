name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Keep required check names stable; each PR update has one validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The work below used to be one job with 26 sequential steps on a single
# runner, which cost ~13.5 minutes, almost half of it in the two .NET test
# projects run one after the other. None of those steps depend on each other, so
# they are split across lanes that run at the same time.
#
# `test` is deliberately kept as a job name. Branch protection requires a check
# context called exactly `test`; renaming the work to `test (dotnet)` or folding
# it into the matrix would leave that context unmatched and block every merge.
# So the lanes fan out under their own names and `test` stays as the gate that
# depends on all of them and asserts the one thing that genuinely needs every
# result: the combined coverage threshold.
#
# A lane is only worth its own runner if it is heavy enough to absorb the ~100s
# of Checkout + toolchain setup that a hosted Windows runner charges per job.
# That is why the CLI and Nexus IDE lanes stay together rather than becoming five.
jobs:
  dotnet:
    name: dotnet (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      # One leg failing must not hide the other's report: the threshold assertion
      # needs both, and a cancelled sibling would leave a missing cobertura file.
      fail-fast: false
      matrix:
        include:
          - label: gateway
          - label: worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.0.x

      # Restore and build outputs, not just the NuGet packages. A PR that does
      # not touch C# should not rebuild the dependency chain; MSBuild still
      # recompiles whatever source changed, so a stale cache cannot mask an edit.
      - name: Cache NuGet packages and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
            .test-bin/${{ matrix.label }}
            src/**/obj
            src/**/bin
          key: dotnet-${{ runner.os }}-${{ matrix.label }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.*', '**/Directory.Packages.props', '**/NuGet.Config', '**/*.runsettings') }}
          restore-keys: |
            dotnet-${{ runner.os }}-${{ matrix.label }}-

      - name: Collect ${{ matrix.label }} coverage
        shell: pwsh
        run: ./scripts/coverage/collect.ps1 -OutputRoot "$env:RUNNER_TEMP\gx-coverage-artifacts" -Label ${{ matrix.label }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.label }}
          path: ${{ runner.temp }}\gx-coverage-artifacts

  toolchain:
    name: toolchain (cli + nexus-ide)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/nexus-ide/package-lock.json

      - name: Cache VS Code test runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/nexus-ide/.vscode-test
          key: nexus-ide-vscode-${{ runner.os }}-1.111.0
          restore-keys: |
            nexus-ide-vscode-${{ runner.os }}-

      - name: Install npm deps
        run: npm ci

      - name: CLI tests
        run: npm test

      - name: Root lint
        run: npm run lint

      - name: Install Nexus IDE deps
        working-directory: src/nexus-ide
        run: npm ci

      - name: Nexus IDE compile
        working-directory: src/nexus-ide
        run: npm run compile

      - name: Nexus IDE lint
        working-directory: src/nexus-ide
        run: npm run lint

      - name: Nexus IDE tests
        working-directory: src/nexus-ide
        run: npm test

      # The .vsix is a required release asset, but nothing in CI ran `vsce
      # package`, so a dependency bump could break packaging and land green
      # (issue #482: @types/vscode ^1.140.0 against engines.vscode ^1.93.0
      # compiles fine and only fails at package time). Packaging is validated
      # here, and the artifact is asserted rather than uploaded, so the release
      # stays the only place a .vsix is produced.
      - name: Nexus IDE package
        working-directory: src/nexus-ide
        run: npm run package

      - name: Verify Nexus IDE VSIX was produced
        shell: pwsh
        run: |
          $expected = (Get-Content -LiteralPath src/nexus-ide/package.json -Raw | ConvertFrom-Json).version
          $vsix = @(Get-ChildItem -LiteralPath src/nexus-ide -Filter '*.vsix' -File)
          if ($vsix.Count -ne 1) { throw "Expected exactly one .vsix, found $($vsix.Count): $($vsix.Name -join ', ')" }
          if ($vsix[0].Name -ne "nexus-ide-$expected.vsix") {
            throw "Packaged '$($vsix[0].Name)' but package.json version is '$expected'."
          }

  rust:
    name: rust (gxwire)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Identify Rust toolchain
        id: rust
        shell: pwsh
        run: |
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain is unavailable.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache gxwire dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            src/gxwire/target
          key: gxwire-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src/gxwire/Cargo.lock', 'src/gxwire/Cargo.toml', 'src/gxwire/**/*.rs', 'src/gxwire/**/build.rs', '**/.cargo/config*') }}
          restore-keys: |
            gxwire-${{ runner.os }}-${{ steps.rust.outputs.version }}-

      - name: Build and test gxwire engine
        shell: pwsh
        run: |
          cargo test --manifest-path src/gxwire/Cargo.toml
          cargo build --release --manifest-path src/gxwire/Cargo.toml
          New-Item -ItemType Directory -Path publish -Force | Out-Null
          Copy-Item src/gxwire/target/release/gxwire.exe -Destination publish/gxwire.exe -Force

  contracts:
    name: contracts (python + docs)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Verify release metadata synchronization
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          python scripts/verify-release-metadata.py --root . --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Release-facing metadata is out of sync. Run python scripts/sync-release-metadata.py --version <package-version> --write.' }

      - name: Validate quality gate manifests and scripts
        shell: pwsh
        run: |
          $scriptPaths = @(
            'scripts/pr-preflight.ps1',
            'scripts/pr-push.ps1',
            'scripts/install.ps1',
            'scripts/install-transaction.ps1',
            'scripts/test-live.ps1',
            'scripts/integration-preflight.ps1',
            'scripts/read-issue.ps1',
            'scripts/check-upstream-drift.ps1',
            'scripts/test-live-matrix.ps1',
            'scripts/check-build-warning-baseline.ps1'
          )
          foreach ($path in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax errors in ${path}: $($errors -join '; ')"
            }
          }
          ./scripts/check-build-warning-baseline.ps1 -ValidateOnly
          ./scripts/tests/test-upstream-drift.ps1
          ./scripts/tests/test-live-matrix.test.ps1
          ./scripts/tests/test-integration-preflight.ps1
          ./scripts/tests/sdk-validation-contract.tests.ps1
          ./scripts/tests/install-contract.tests.ps1
          python -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/bench-live-http.py').read_text(encoding='utf-8')); print('benchmark-python: valid')"
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark Python syntax validation failed.' }
          python -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/validate-v3-plan.py').read_text(encoding='utf-8')); print('v3-plan-python: valid')"
          if ($LASTEXITCODE -ne 0) { throw 'v3 plan Python syntax validation failed.' }
          python scripts/validate-v3-evaluation.py
          if ($LASTEXITCODE -ne 0) { throw 'v3 evaluation corpus validation failed.' }
          python scripts/validate-v3-evaluation.py tests/agent-evals/corpus.json
          if ($LASTEXITCODE -ne 0) { throw 'v3 agent replay corpus validation failed.' }
          python scripts/validate-v3-plan.py
          if ($LASTEXITCODE -ne 0) { throw 'v3 execution plan validation failed.' }
          python scripts/validate-tool-contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'tool contract validation failed.' }

      - name: Benchmark gate regression tests
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python from the Windows runner image is required.' }
          python -m unittest discover -s scripts/tests -p "test_bench_live_http.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark gate regression tests failed.' }
          python -m unittest discover -s scripts/tests -p "test_validate_v3_evaluation.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'v3 evaluation corpus tests failed.' }
          python -m unittest discover -s scripts/tests -p "test_validate_v3_plan.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'v3 execution plan tests failed.' }
          python -m unittest discover -s scripts/tests -p "test_validate_tool_contracts.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'tool contract tests failed.' }

      - name: LLM contract smoke
        shell: pwsh
        run: ./scripts/mcp_llm_contract_smoke.ps1

  # The required check. Every lane above must have passed; this job exists to keep
  # the name `test` on the merge gate and to assert the one result that cannot be
  # judged by a single lane - the coverage threshold over both projects together.
  test:
    name: test
    runs-on: windows-latest
    needs: [dotnet, toolchain, rust, contracts]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Download gateway coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-gateway
          path: ${{ runner.temp }}\gx-coverage-artifacts

      - name: Download worker coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-worker
          path: ${{ runner.temp }}\gx-coverage-artifacts

      - name: Assert combined coverage threshold
        shell: pwsh
        run: ./scripts/coverage/assert-threshold.ps1 -CoverageRoot "$env:RUNNER_TEMP\gx-coverage-artifacts" -MinLineRatePercent 60

      - name: SDK validation lane status
        if: vars.GXMCP_SDK_CI_ENABLED != 'true'
        shell: pwsh
        run: |
          "## GeneXus SDK validation lane" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "**skip** — protected self-hosted runner is not enabled (`GXMCP_SDK_CI_ENABLED` is not `true`)." | Out-File $env:GITHUB_STEP_SUMMARY -Append

  # Contract test: the gateway builds without the GeneXus SDK (net10.0-windows, no
  # Artech refs), so this runs on CI. It launches a real gateway in-process and runs
  # scripts/mcp_smoke.ps1 unmodified against it — pinning first-party diagnostic
  # scripts to the gateway's HTTP protocol contract (the v2.38.0-v2.45.1 406 drift).
  # Kept beside the coverage lanes rather than in `contracts` because it reuses the
  # Gateway test build they already produced; moving it would pay a cold rebuild.
  mcp-smoke:
    name: mcp-smoke
    runs-on: windows-latest
    needs: dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.0.x

      - name: MCP smoke script contract test
        run: >
          dotnet test src/GxMcp.Gateway.Tests/GxMcp.Gateway.Tests.csproj
          --filter "FullyQualifiedName~McpSmokeScriptContract"

  sdk-validation:
    if: vars.GXMCP_SDK_CI_ENABLED == 'true'
    runs-on: [self-hosted, windows, gx-sdk-18]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: 10.0.x

      - name: Run protected SDK and live Worker validation
        shell: pwsh
        run: .\scripts\ci\sdk-validation.ps1 -OutputRoot "$env:RUNNER_TEMP\gxmcp-sdk-validation"

      - name: Publish SDK lane status and logs
        if: always()
        shell: pwsh
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'gxmcp-sdk-validation\status.json'
          if (Test-Path -LiteralPath $status) {
            Get-Content -LiteralPath $status | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "sdk-validation state=fail reason=status.json was not produced" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload SDK validation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gxmcp-sdk-validation
          path: ${{ runner.temp }}\gxmcp-sdk-validation
          retention-days: 14
          if-no-files-found: warn